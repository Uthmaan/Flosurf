name: CI Token Build & AI Audit Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-audit:
    name: Build Multi-Mode Tokens & Run Audit Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Design Tokens (Style Dictionary v4)
        run: npm run build

      - name: Gate 1 — Zero Hardcoded Hex/Px Linter
        run: npm run audit:hardcoded src

      - name: Gate 2 — WCAG 2.2 / APCA Contrast Matrix
        run: npm run audit:contrast

      - name: Gate 3 — WAI-ARIA & State Matrix Contract
        run: npm run audit:states

      - name: Gate 4 — Layout & Stress Test (300% Zoom & Localization)
        run: npm run audit:stress

      - name: Verify Visualizer Integrity
        run: |
          test -s visualizer/index.html
          echo "Visualizer verified and packaged."

      - name: Upload Compiled Tokens & Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flosurf-compiled-tokens
          path: |
            dist/
            visualizer/index.html
          retention-days: 30

      - name: Setup GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'visualizer'

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
